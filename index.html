    function filterMenu(label, kind, options) {
      return `<details class="filter-menu" data-filter-menu="${kind}"><summary>${label}: All</summary><div class="filter-options">${options.map(o => `<label><input type="checkbox" data-filter="${kind}" value="${o[0]}"> <span>${o[1]}</span></label>`).join('')}</div></details>`;
    }

    function catalogueControls(kind) {
      const themeOptions = Object.entries(themeNames).map(([k, v]) => [v, v]);
      const typeOptions = typeNames.map(x => [x, x]);
      return `<div class="filterbar">${filterMenu('Theme', 'theme', themeOptions)}${kind === 'publications' ? filterMenu('Type', 'type', typeOptions) : ''}<button class="filter-reset" type="button" data-reset-filters>Reset</button></div>`;
    }

    // Build full-text search index for each publication (hidden, not displayed)
    function pubSearchText(x) {
      return [x.title, x.summary, x.authors, x.editors, x.type, String(x.year), ...(x.themes||[]), x.apa, x.titleZh].filter(Boolean).join(' ').toLowerCase();
    }

    // Build full-text search index for each project (hidden, not displayed)
    function projSearchText(p) {
      return [p.title, p.summary, p.role, p.funder, p.dates, ...(p.themes||[]), p.outcomes].filter(Boolean).join(' ').toLowerCase();
    }

    function cataloguePubCards() {
      return publications.map((x, idx) => {
        const themesAttr = (x.themes || []).join(';');
        const typeAttr = x.type || '';
        const searchText = pubSearchText(x);
        return `<article class="item searchable clickable" data-kind="publication" data-index="${idx}" data-themes="${themesAttr}" data-type="${typeAttr}" data-search="${searchText.replace(/"/g,'&quot;')}" tabindex="0" role="button"><h2>${x.title}</h2></article>`;
      }).join('');
    }

    function catalogueProjectCards() {
      const current = projects.filter(p => p.group === 'Current Projects');
      const completed = projects.filter(p => p.group === 'Completed Projects');

      const renderGroup = (groupProjects) => groupProjects.map((p) => {
        const idx = projects.indexOf(p);
        const themesAttr = (p.themes || []).join(';');
        const searchText = projSearchText(p);
        return `<article class="item searchable clickable" data-kind="project" data-index="${idx}" data-themes="${themesAttr}" data-search="${searchText.replace(/"/g,'&quot;')}" tabindex="0" role="button"><h2>${p.title}</h2></article>`;
      }).join('');

      return `<h2 class="project-group-label">Current Projects</h2>` +
        renderGroup(current) +
        `<h2 class="project-group-label">Completed Projects</h2>` +
        renderGroup(completed);
    }

    function buildProjectOutcomes(outcomesRaw) {
      if (!outcomesRaw || !outcomesRaw.trim()) return '';
      const lines = outcomesRaw.split('\n').map(l => l.trim().replace(/^[-*]\s*/, '').replace(/^<i>|<\/i>$/g, '').trim()).filter(Boolean);
      const items = lines.map(plain => {
        const url = projectPublicationLinks[plain] || '';
        if (url) return `<a href="${url}" target="_blank" rel="noopener"><i>${plain}</i></a>`;
        return `<i>${plain}</i>`;
      });
      return items.length > 1 ? `<ul class="quiet-list">${items.map(item => `<li>${item}</li>`).join('')}</ul>` : items[0];
    }

    // Publication copy may contain either authored HTML italics or legacy Markdown emphasis.
    // Render both forms in the visitor-facing modal while keeping the canonical data intact.
    function renderPublicationRichText(value) {
      return String(value || '')
        .replace(/\(\s*(\d{4})\s*,\s*[A-Za-z]+\s+\d{1,2}\s*\)/g, '($1)')
        .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    }

    function renderPublicationApa(x) {
      let apaFormatted = renderPublicationRichText(x.apa);
      const urlMatch = apaFormatted.match(/https?:\/\/[^\s<)]+/);
      if (!urlMatch) return apaFormatted;
      const url = urlMatch[0];
      const linkText = url.startsWith('https://doi.org/') ? url : 'View publication';
      return apaFormatted.replace(url, `<a href="${url}" target="_blank" rel="noopener">${linkText}</a>`);
    }

    function applyFilters() {
      const route = (location.hash.slice(1) || '/').split('?')[0];
      if (route !== '/publications' && route !== '/projects') return;

      const isPub = route === '/publications';
      const cards = [...document.querySelectorAll('.panel[data-panel="catalogue"] .item')];
      const selectedThemes = [...document.querySelectorAll('input[data-filter="theme"]:checked')].map(x => x.value);
      const selectedTypes = [...document.querySelectorAll('input[data-filter="type"]:checked')].map(x => x.value);
      const q = (document.getElementById('search')?.value || '').toLowerCase().trim();

      let shown = 0;
      cards.forEach(card => {
        const cardThemes = (card.dataset.themes || '').split(';').map(t => t.trim()).filter(Boolean);
        const cardType = card.dataset.type || '';
        // Use full data-search attribute for text search
        const searchText = card.dataset.search || card.textContent.toLowerCase();

        const themeOk = !selectedThemes.length || selectedThemes.some(t => cardThemes.includes(t));
        const typeOk = !isPub || !selectedTypes.length || selectedTypes.includes(cardType);
        const searchOk = !q || searchText.includes(q);

        const visible = themeOk && typeOk && searchOk;
        card.style.display = visible ? 'block' : 'none';
        if (visible) shown++;
      });

      if (!isPub) {
        document.querySelectorAll('.panel[data-panel="catalogue"] .project-group-label').forEach(label => {
          let next = label.nextElementSibling;
          let hasVisible = false;
          while (next && !next.classList.contains('project-group-label')) {
            if (next.style.display !== 'none') hasVisible = true;
            next = next.nextElementSibling;
          }
          label.style.display = hasVisible ? 'block' : 'none';
        });
      }

      // No result counts shown — only zero-result message
      const emptyEl = document.querySelector('.filter-empty');
      if (emptyEl) {
        emptyEl.style.display = shown ? 'none' : 'block';
      }

      document.querySelectorAll('[data-filter-menu]').forEach(menu => {
        const kind = menu.dataset.filterMenu;
        const values = kind === 'theme' ? selectedThemes : selectedTypes;
        menu.querySelector('summary').textContent = `${kind === 'theme' ? 'Theme' : 'Type'}: ${values.length ? values.join(', ') : 'All'}`;
      });
    }

            </ul>
            <p>I also value contributing to and building communities through editorial work, collaboration, and wider academic service. My co-edited books include the <em>Handbook of Meta-Research</em> (with Alis Oancea, Gemma Derrick and Nuzha Nuseibeh; Edward Elgar, 2024) and <em>Changing Higher Education in East Asia</em> (with Simon Marginson; Bloomsbury, 2022), which received an Honourable Mention in the 2024 CIES Higher Education SIG Best Book Award. I am a Coordinating Editor of <em>Higher Education</em> and a Book Series Editor for Palgrave Studies on Chinese Education in a Global Perspective.</p>
            <p>My research has generated wider public and policy impact. Research and commentaries have appeared in <em>Nature</em>, <em>Times Higher Education</em>, <em>The Conversation</em>, <em>HEPI Blog</em>, and <em>University World News</em>. I have also contributed research evidence and expertise to policymaking and public debate in the UK and internationally.</p>
            <p>At the Department of Education, I lead the MSc in Education (Higher Education) pathway, convene the core module <em>Global Higher Education</em>, and supervise DPhil and MSc dissertations. I am a Fellow of the Higher Education Academy (FHEA), and have co-led the development of the <a href="https://www.education.ox.ac.uk/project/neurodivergent-education-for-students-teaching-learning-nestl/" target="_blank" rel="noopener">Neurodivergent Education for Students, Teaching &amp; Learning (NESTL) Toolkit</a>, a practical resource for supporting neurodivergent-inclusive teaching and learning. The project was Highly Commended in the University of Oxford Vice-Chancellor's Awards 2026.</p>
            <p>I received my DPhil in Education from the University of Oxford and have studied at Tsinghua University, Peking University, and Heidelberg University.</p>
          </article>
          <article class="item short-bio">
            <h2>Short bio</h2>
            <p class="short-bio-note">Please feel free to use or adapt this bio as needed.</p>
            <p>Dr Xin Xu is a Senior Departmental Lecturer in Higher and Tertiary Education at the University of Oxford, and Deputy Director of the Centre on Skills, Knowledge, and Organisational Performance (SKOPE). Her research explores tertiary education and research in changing social and global contexts. She is a co-editor of the <em>Handbook of Meta-Research</em> and <em>Changing Higher Education in East Asia</em>.</p>
          </article>

      } else if (r === '/research') {
        h = `<section class="page">
          <h1>Research Overview</h1>

            <article class="item">

    function replayWelcomeMotion() {

      const hero = document.querySelector('.hero');
      if (!hero) return;
      const elements = [hero.querySelector('h1'), hero.querySelector('.lead:first-of-type'), hero.querySelector('.role-note')].filter(Boolean);
      elements.forEach(element => element.classList.remove('welcome-motion'));
      void hero.offsetWidth;
      requestAnimationFrame(() => elements.forEach(element => element.classList.add('welcome-motion')));

      document.querySelectorAll('details.filter-menu[open]').forEach(menu => {
        if (!menu.contains(event.target)) menu.removeAttribute('open');
      });
    });

    const filterCloseTimers = new WeakMap();
    document.addEventListener('pointerover', event => {
      if (event.pointerType !== 'mouse') return;
      const menu = event.target.closest('details.filter-menu');
      if (menu) clearTimeout(filterCloseTimers.get(menu));
    });
    document.addEventListener('pointerout', event => {
      if (event.pointerType !== 'mouse') return;
      const menu = event.target.closest('details.filter-menu');
      if (menu && (!event.relatedTarget || !menu.contains(event.relatedTarget))) {
        clearTimeout(filterCloseTimers.get(menu));
        filterCloseTimers.set(menu, setTimeout(() => menu.removeAttribute('open'), 220));
      }
    });

    });
